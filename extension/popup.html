<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookmarkSoft Launcher</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <div class="logo">B</div>
    <h2>BookmarkSoft</h2>
  </div>
  
  <div class="search-container">
    <input type="text" id="search-input" placeholder="Search 100+ tools..." autofocus autocomplete="off">
  </div>

  <div class="results" id="results">
    <!-- Results will be populated here by popup.js -->
  </div>

  <div class="footer">
    <a href="https://bookmarksoft.com" target="_blank" id="website-link">Open Full Website</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
